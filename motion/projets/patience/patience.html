<script>
const { $, show, prog, lerp, clamp, E, pulse, extrude, letters, seeded } = M;
const WORDS = ALIGN.words, B = ALIGN.blocks;
const F = (str, from = 0) => (WORDS.find(w => w.s >= from - 0.01 && w.w.toLowerCase().includes(str)) || { s: from }).s;
const END = ALIGN.duration, DURATION = END + 1.9;

// ---------- temps clés, calés sur la voix ----------
const T = {
  vous: B[0], etre: F("l'être"), crea: F('créature'), imp: F('impatiente'), pres: F('pressée'),
  faute: F('faute', B[1]), chatie: F('châtie', B[1]),
  seig: B[2], mis: F('miséricorde'), par: F('pardon'), nepas: F('châtier', B[2]),
  cherche: F('cherche', B[3]), inciter: F('inciter'), chat4: F('châtier', B[3]),
  mais: B[4], bonne: F('bonne', B[4]), dieu: F('dieu', B[4]), accorde: F('accorde'),
  enerve: B[5], instant: F("l'instant"), presse6: B[6],
  logic: B[7], simp7: F("s'impatiente", B[7]), alors: B[8], simp8: F("s'impatienter", B[8]), chatie8: F('châtié', B[8]),
  regle: B[9], rec9: F('récompense', B[9]), chat10: F('châtiment', B[10]),
  lecon: B[11], chat11: F('châtiment', B[11]), b12: B[12], rec12: F('récompense', B[12]),
};
T.outro = Math.max(T.rec12 + 0.55, END - 0.5);

// ---------- couleurs pilotées par le propos ----------
const PAL = [[0, '#ff8a3d'], [B[1], '#ff3d5a'], [B[2], '#ffcf5a'], [T.mis + 0.6, '#3dffb4'], [B[3], '#22e5ff'], [B[4], '#7dff6b'],
  [B[5], '#ff3d5a'], [B[7], '#a66bff'], [B[9], '#4d8dff'], [B[11], '#ffcf5a'], [DURATION + 1, '#ffcf5a']];
const CHAP = [[0, "L'ÊTRE HUMAIN"], [B[1], 'LA FAUTE'], [B[2], 'LA MISÉRICORDE'], [B[3], 'LA CRÉATURE'], [B[4], 'MAIS…'],
  [B[5], "L'IMPATIENCE"], [B[7], 'LA LOGIQUE'], [B[9], 'LA RÈGLE'], [B[11], 'LA LEÇON']];
const KEY = { 'impatiente': '#ff3d5a', 'pressée': '#ff8a3d', 'pressé': '#ff8a3d', 'faute': '#ff3d5a', 'châtie': '#ff3d5a', 'châtier': '#ff3d5a',
  'châtié': '#ff3d5a', 'châtiment': '#ff3d5a', 'seigneur': '#ffcf5a', 'dieu': '#ffcf5a', 'miséricorde': '#ffcf5a', 'pardon': '#3dffb4',
  'bonne': '#7dff6b', 'action': '#7dff6b', 'chose': '#7dff6b', "s'énerve": '#ff3d5a', "l'instant": '#ff8a3d', "s'impatiente": '#ff3d5a',
  "s'impatienter": '#ff3d5a', 'impatienter': '#ff3d5a', 'impatient': '#ff3d5a', 'récompense': '#7dff6b', "l'être": '#ff8a3d', 'humain': '#ff8a3d' };

// ---------- effets sonores (lus par le script de rendu) ----------
const CUES = [];
const cue = (t, fx, gain = 1) => CUES.push({ t: Math.max(0, +t.toFixed(3)), fx, gain });
cue(0, 'whoosh_low', .7); cue(T.vous, 'typing', .6); cue(T.etre - .05, 'whoosh', .8); cue(T.etre + .1, 'impact', .6);
cue(T.crea, 'pop', .8); cue(T.imp, 'impact', .55); cue(T.imp, 'glitch', .7); cue(T.pres, 'swipe', .8); cue(T.pres + .05, 'pop', .7);
cue(B[1] - .3, 'whoosh', .9); cue(B[1] + .1, 'glitch', .8); cue(T.faute, 'pop', .8); cue(T.faute + .5, 'click', .8); cue(T.chatie, 'impact', .8); cue(T.chatie, 'glitch', .6);
cue(B[2] - 1.2, 'riser', .7); cue(B[2], 'whoosh_low', .7); cue(B[2] + .2, 'pop', .6); cue(T.mis, 'shimmer', .9); cue(T.par, 'ding', .7); cue(T.nepas, 'swipe', .8);
cue(B[3] - .5, 'wind', 1); cue(B[3] + .2, 'pop', .7); cue(B[3] + .5, 'pop_high', .6); cue(T.inciter, 'click', .9); cue(T.inciter + .1, 'glitch', .4); cue(T.chat4, 'ding', .7);
cue(B[4] - .35, 'whoosh', 1); cue(B[4], 'impact', .9); cue(T.bonne, 'ding', .7); cue(T.bonne - .1, 'swipe', .6); cue(T.dieu - .2, 'shimmer', .9);
cue(T.accorde, 'pop', .8); cue(T.accorde + .2, 'typing', .5);
cue(B[5], 'impact', .9); cue(B[5] + .05, 'glitch', .9); cue(B[5] + .35, 'pop', .6); cue(B[5] + .6, 'pop', .6);
for (let i = 0; i < 4; i++) cue(T.instant + i * .25, 'click', .9);
cue(B[6] - .3, 'whoosh', 1); cue(B[6], 'impact', .8);
cue(B[7] - .4, 'wind', 1); cue(B[7] + .1, 'swipe', .8); cue(T.simp7, 'pop_high', .7);
cue(B[8], 'swipe', .8); cue(T.simp8, 'glitch', .7); cue(T.simp8 + .1, 'typing', .5); cue(T.chatie8, 'pop', .8);
cue(B[9] - .35, 'whoosh_low', .9); cue(B[9] + .1, 'pop', .6); cue(T.chat10, 'whoosh', .5); cue(T.chat10 + .35, 'ding', .8); cue(T.chat10 + 1, 'shimmer', .7);
cue(B[11] - .4, 'wind', 1); cue(B[11] + .1, 'pop', .7); cue(T.chat11, 'pop_high', .6); cue(B[12], 'swipe', .7); cue(T.rec12, 'pop_high', .7);
cue(T.outro - 1.3, 'riser', .8); cue(T.outro, 'impact', 1); cue(T.outro, 'shimmer', 1);
for (let i = 0; i < 8; i++) cue(T.outro + .15 + i * .07, 'pop_high', .3);

// ---------- icônes néon ----------
const glow = c => `filter:drop-shadow(0 0 10px ${c}) drop-shadow(0 0 26px ${c})`;
const HUMAN = c => `<g style="${glow(c)}"><circle cx="100" cy="58" r="30" stroke="${c}" stroke-width="10"/><path d="M38 182 Q38 108 100 108 Q162 108 162 182" stroke="${c}" stroke-width="10"/></g>`;
const CLOCK = c => `<g style="${glow(c)}"><circle cx="100" cy="100" r="80" stroke="${c}" stroke-width="10"/><line class="hh" x1="100" y1="100" x2="100" y2="58" stroke="${c}" stroke-width="10"/><line class="mh" x1="100" y1="100" x2="100" y2="38" stroke="#fff" stroke-width="7"/><circle cx="100" cy="100" r="7" fill="${c}" stroke="none" style="fill:${c}"/></g>`;
const BOLT = c => `<g style="${glow(c)}"><polygon points="115,10 45,112 95,112 78,192 160,78 108,78 135,10" stroke="${c}" stroke-width="9" style="fill:${c}33"/></g>`;
const GIFT = c => `<g style="${glow(c)}"><rect x="40" y="88" width="120" height="96" rx="10" stroke="${c}" stroke-width="9"/><rect x="30" y="62" width="140" height="30" rx="8" stroke="${c}" stroke-width="9"/><line x1="100" y1="62" x2="100" y2="184" stroke="${c}" stroke-width="9"/><path d="M100 60 C 70 20 45 45 70 60 M100 60 C 130 20 155 45 130 60" stroke="${c}" stroke-width="9"/></g>`;
$('s1human').innerHTML = HUMAN('#ff8a3d');
$('s1clock').innerHTML = CLOCK('#ff8a3d');
$('s1ring').innerHTML = `<svg width="500" height="500" style="overflow:visible;${glow('#ff8a3d')}">${Array.from({ length: 60 }, (_, i) => {
  const a = i / 60 * 6.283, r1 = i % 5 ? 228 : 210;
  return `<line x1="${250 + Math.cos(a) * r1}" y1="${250 + Math.sin(a) * r1}" x2="${250 + Math.cos(a) * 245}" y2="${250 + Math.sin(a) * 245}" stroke="#ff8a3d" stroke-width="${i % 5 ? 4 : 9}" stroke-linecap="round"/>`;
}).join('')}</svg>`;
$('s2warn').innerHTML = `<g style="${glow('#ff3d5a')}"><path d="M100 18 L186 172 L14 172 Z" stroke="#ff3d5a" stroke-width="12" style="fill:#ff3d5a22"/><line x1="100" y1="72" x2="100" y2="122" stroke="#fff" stroke-width="14"/><circle cx="100" cy="148" r="5" stroke="#fff" stroke-width="12"/></g>`;
$('s2bolt').innerHTML = BOLT('#ffcf5a');
$('s3heart').innerHTML = `<g style="${glow('#ffcf5a')}"><path d="M100 172 C 22 120 14 62 54 46 C 80 36 95 50 100 66 C 105 50 120 36 146 46 C 186 62 178 120 100 172 Z" stroke="#ffcf5a" stroke-width="10" style="fill:#ffcf5a22"/></g>`;
$('s4human').innerHTML = HUMAN('#22e5ff');
$('s4btn').innerHTML = `<svg width="340" height="300" viewBox="0 0 340 300" style="overflow:visible">
  <ellipse cx="170" cy="200" rx="150" ry="60" fill="#3a0a14" stroke="#ff3d5a" stroke-width="6"/>
  <rect x="20" y="140" width="300" height="60" fill="#3a0a14"/>
  <g id="s4cap"><ellipse cx="170" cy="140" rx="150" ry="60" fill="#ff3d5a" style="${glow('#ff3d5a')}"/>
  <text x="170" y="154" text-anchor="middle" font-family="P" font-weight="900" font-size="40" fill="#fff">CHÂTIMENT</text></g></svg>`;

// balance : fléau qui pivote, plateaux qui restent à la verticale
function makeScale(el, cx, py, half, cl, cr, labL, labR, iconL = '', iconR = '') {
  el.innerHTML = `<svg width="1080" height="1400" style="position:absolute;overflow:visible">
    <g style="${glow('#c9d3ff')}"><line x1="${cx}" y1="${py}" x2="${cx}" y2="${py + 420}" stroke="#c9d3ff" stroke-width="12"/>
    <path d="M${cx - 120} ${py + 430} L${cx + 120} ${py + 430}" stroke="#c9d3ff" stroke-width="14"/><circle cx="${cx}" cy="${py}" r="16" style="fill:#c9d3ff"/></g>
    <g class="beam"><line x1="${cx - half}" y1="${py}" x2="${cx + half}" y2="${py}" stroke="#fff" stroke-width="12" style="${glow('#fff')}"/></g>
    ${[['L', cl, labL, iconL], ['R', cr, labR, iconR]].map(([s, c, lab, ic]) => `<g class="pan${s}">
      <line x1="0" y1="0" x2="-90" y2="170" stroke="${c}" stroke-width="5"/><line x1="0" y1="0" x2="90" y2="170" stroke="${c}" stroke-width="5"/>
      <path d="M-120 170 Q0 240 120 170 Z" stroke="${c}" stroke-width="8" style="fill:${c}33;${glow(c)}"/>
      <text x="0" y="285" text-anchor="middle" font-family="P" font-weight="900" font-size="44" style="fill:${c};${glow(c)}">${lab}</text>
      <g transform="translate(-55 55) scale(.55)">${ic}</g></g>`).join('')}</svg>`;
  return angle => {
    const a = angle * Math.PI / 180;
    el.querySelector('.beam').setAttribute('transform', `rotate(${angle} ${cx} ${py})`);
    el.querySelector('.panL').setAttribute('transform', `translate(${cx - Math.cos(a) * half} ${py - Math.sin(a) * half})`);
    el.querySelector('.panR').setAttribute('transform', `translate(${cx + Math.cos(a) * half} ${py + Math.sin(a) * half})`);
  };
}

}

  show($('s8l1'), t, { i: B[11] + .05, id: .5, f: { y: -80, s: .7 }, o: outK, od: .3, to: { y: -300, o: 0, b: 10 } });
  show($('s8l2'), t, { i: B[12] + .05, id: .5, f: { y: 80, s: .7 }, o: outK, od: .3, to: { y: 300, o: 0, b: 10 } });
  show($('s8glass'), t, { i: B[11] + .2, id: .7, f: { s: .3, rx: 90 }, o: outK, od: .3, to: { s: 0, o: 0, r: 180 }, add: { ry: t * 30 } });
  const sand = prog(t, B[11], END - B[11]);
  $('sandTop').setAttribute('y', 30 + 120 * sand); $('sandTop').setAttribute('height', 120 * (1 - sand));
  $('sandBot').setAttribute('y', 270 - 120 * sand); $('sandBot').setAttribute('height', 120 * sand);
  $('sandFlow').style.strokeDashoffset = -t * 80;
  $('s8rays').style.opacity = .5 * prog(t, B[11], 1) + .6 * prog(t, T.outro, .5); $('s8rays').style.transform = `rotate(${-t * 10}deg)`;
  lettersIn(L.fin, t, T.outro + .1, .07, { z: 700, y: -40, s: 2.2, rx: 40, b: 20 });
  show($('s8final'), t, { i: T.outro, id: .1, f: { o: 1 }, add: { s: 1 + (t - T.outro) * .02, rx: Math.sin(t * 1.5) * 6 } });
  show($('s8sub'), t, { i: T.outro + .9, id: .5, f: { y: 40, s: .8 } });
  $('s8sub').style.letterSpacing = lerp(40, 10, E.out(prog(t, T.outro + .9, 1))) + 'px';

  // --- sous-titres karaoké ---
  M.subtitles($('sub'), t, chunks, KEY, css, T.outro - .1);
};
window.DURATION = DURATION; window.CUES = CUES;
seek(0);
</script>
