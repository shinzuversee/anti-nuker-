<noscript><h1>Nūr al-Bayān (نور البيان)</h1><p>Nūr al-Bayān (نور البيان) : la clarté dans l'étude du Coran. Articles, cours et réponses argumentées sur Dieu, la foi, les attributs divins et les questions les plus exigeantes, appuyés sur les sources et les grands commentateurs.</p><h2>Chapitre 1 : Connaissez-vous Dieu ?</h2><ul><li>Connaissez-vous Dieu ?</li><li>« Allāh » est le nom, en arabe, de Celui qui crée toute chose</li><li>Croire en Dieu est naturel à l'homme</li><li>Si la foi est rationnelle, pourquoi tant de savants n'y adhèrent-ils pas ?</li><li>Dieu regarde-t-Il l'homme, si petit dans l'immensité du cosmos ?</li><li>Allāh est-il « un dieu des Arabes » ?</li><li>Peut-on voir Dieu de ces yeux-ci ?</li><li>Dieu était, et rien n'était avec Lui : le temps commence-t-il avec la création ?</li><li>Nul n'a la garantie de mourir croyant : la notion de muwāfāt</li><li>L'amour de Dieu : ce qui l'attire, ce qui l'éloigne</li><li>Une objection : un Dieu qui châtie l'incroyance est-il juste ?</li><li>Le langage des attributs divins</li><li>Affirmer sans comparer : le verset qui gouverne la question</li><li>Dieu sait tout, entend tout, voit tout, et a pouvoir sur toute chose</li><li>La parole divine : ce qui est affirmé et ce qui ne l'est pas</li><li>« Dieu est en haut » : hauteur, séparation, infinité</li><li>« Dieu est avec vous » et « Je suis proche » : concilier les registres</li><li>Ce que l'on remet à Dieu : le sens des termes, ou la réalité qu'ils désignent ?</li><li>Ta'wīl : là où elle s'impose, là où elle ne s'étend pas</li><li>Une classification des attributs : essentiels, actifs, personnels</li><li>Attributs de beauté et attributs de rigueur</li><li>Peut-on employer pour d'autres que Lui les termes qui Le qualifient ?</li><li>« Afin que Nous sachions » : Dieu ignorerait-Il l'avenir ?</li><li>Un nom, quatre-vingt-dix-neuf, ou davantage ?</li></ul></noscript>
